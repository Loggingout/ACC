<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Reviews</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <!-- Custom styles -->
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <!-- SVG sprite -->
  <svg style="display:none;">
    <symbol id="people-icon" viewBox="0 0 16 16">
      <path d="M15 14s1 0 1-1-1-4-5-4-5 3-5 4 1 1 1 1z"/>
      <path d="M11 7a2 2 0 1 0 0-4 2 2 0 0 0 0 4"/>
      <path d="M1.5 5.5a3 3 0 1 1 6 0 3 3 0 0 1-6 0"/>
    </symbol>
  </svg>

  <!-- Page container -->
  <main class="container-fluid container-md my-4 my-md-5 px-3 px-md-4 p-2">

    <!-- Header -->
    <header
      class="d-flex flex-column flex-sm-row
             justify-content-between align-items-center
             gap-3 mb-4 p-3
             rounded-pill border border-2 border-black"
    >
      <h5 class="mb-0 text-white border rounded-pill px-3 py-2 text-center">
        Reviews
      </h5>

      <a href="/index.html" class="btn btn-outline-light rounded-pill">
        Return home
      </a>
    </header>

    <p class="text-center mb-4 mb-md-5 px-2">
      A couple reviews left on Google and Yelp
    </p>

    <!-- Reviews grid -->
    <section
      class="row g-3 g-md-4"
      id="reviews-container"
    >
      <!-- JS injects review cards here -->
    </section>

    <!-- CTA buttons -->
    <div class="text-center mt-4 mt-md-5 d-flex flex-column flex-sm-row gap-3 justify-content-center">
      <a
        href="https://www.google.com/search?q=A+cheerful+Cup+Reviews"
        target="_blank"
        rel="noopener noreferrer"
        class="btn btn-outline-success px-4"
      >
        Leave Google Review
      </a>

      <a
        href="https://www.yelp.com/writeareview"
        target="_blank"
        rel="noopener noreferrer"
        class="btn btn-outline-warning px-4"
      >
        Leave Yelp Review
      </a>
    </div>

  </main>

  <!-- Scripts -->
  <script src="/Java/reviews.js"></script>

  <script>
    const container = document.getElementById('reviews-container');

    container.innerHTML = reviews.map(review => `
      <article class="col-12 col-sm-6 col-lg-4">
        <div class="card h-100 shadow-sm">

          <div class="card-body">
            <svg width="18" height="18" class="mb-2 text-secondary">
              <use href="#people-icon"></use>
            </svg>

            <h6 class="author fw-semibold mb-1">
              ${review.author}
            </h6>

            <p class="review-rating mb-2">
              ${'⭐'.repeat(review.rating)}
            </p>

            <p class="review-text small mb-0">
              “${review.comment}”
            </p>
          </div>

          <div class="card-footer text-center bg-white small">
            <p class="mb-1">
              Posted:
              <span class="review-date-highlight">
                ${review.date}
              </span>
            </p>
            <p class="text-muted mb-0">
              Left on ${review.source}
            </p>
          </div>

        </div>
      </article>
    `).join('');
  </script>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
  ></script>

</body>
</html>
